<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3d9a3d">
  <meta name="description" content="Echosysteme — Découvrez la faune, la flore, l'histoire et la géographie du Gabon.">
  <title>Echosysteme - La nature du Gabon</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- HEADER sticky -->
  <header class="header">
    <div class="header-left">
      <a href="index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-leaf"></i></span>
        <span class="logo-text">Echo<span>systeme</span></span>
      </a>
    </div>
    <div class="header-center">
      <input type="text" class="search-bar" placeholder="Rechercher..." id="searchInput">
      <button class="search-btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div class="header-right">
      <button class="icon-btn mobile-search-toggle" id="mobileSearchToggle"><i class="fa-solid fa-magnifying-glass"></i></button>
      <div class="avatar">ES</div>
    </div>
  </header>

  <!-- Barre de recherche mobile -->
  <div class="mobile-search-bar" id="mobileSearchBar">
    <input type="text" placeholder="Rechercher faune, flore, histoire..." id="mobileSearchInput">
    <button id="mobileSearchClose"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- SIDEBAR (desktop uniquement) -->
  <aside class="sidebar" id="sidebar">
    <nav>
      <a href="index.html" class="side-link active" data-cat="all"><i class="fa-solid fa-house"></i> Accueil</a>
      <a href="#" class="side-link" data-cat="faune"><i class="fa-solid fa-paw"></i> Faune</a>
      <a href="#" class="side-link" data-cat="flore"><i class="fa-solid fa-tree"></i> Flore</a>
      <a href="#" class="side-link" data-cat="histoire"><i class="fa-solid fa-scroll"></i> Histoire</a>
      <a href="#" class="side-link" data-cat="geo"><i class="fa-solid fa-map"></i> Géographie</a>
    </nav>
  </aside>

  <!-- CONTENU PRINCIPAL -->
  <main class="main-content" id="mainContent">
    
    <section class="banner">
      <div class="banner-overlay">
        <h1><i class="fa-solid fa-globe"></i> Bienvenue sur Echosysteme</h1>
        <p>La nature du Gabon, racontée par Echo</p>
      </div>
    </section>

    <!-- Filtres catégories : DESKTOP uniquement -->
    <section class="categories" id="categories">
      <button class="cat-btn active" data-cat="all">Tout</button>
      <button class="cat-btn" data-cat="faune">Faune</button>
      <button class="cat-btn" data-cat="flore">Flore</button>
      <button class="cat-btn" data-cat="histoire">Histoire</button>
      <button class="cat-btn" data-cat="geo">Géographie</button>
    </section>

    <section class="video-grid" id="videoGrid"></section>

  </main>

  <!-- BOTTOMBAR (mobile uniquement) -->
  <nav class="mobile-nav" id="mobileNav">
    <a href="#" class="mobile-nav-item active" data-cat="all">
      <i class="fa-solid fa-house"></i>
      <span>Accueil</span>
    </a>
    <a href="#" class="mobile-nav-item" data-cat="faune">
      <i class="fa-solid fa-paw"></i>
      <span>Faune</span>
    </a>
    <a href="#" class="mobile-nav-item" data-cat="flore">
      <i class="fa-solid fa-tree"></i>
      <span>Flore</span>
    </a>
    <a href="#" class="mobile-nav-item" data-cat="histoire">
      <i class="fa-solid fa-scroll"></i>
      <span>Histoire</span>
    </a>
    <a href="#" class="mobile-nav-item" data-cat="geo">
      <i class="fa-solid fa-map"></i>
      <span>Géo</span>
    </a>
  </nav>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
