<!DOCTYPE html>
<html lang="fr">
<head>

    <div class="header-right">

  <aside class="sidebar" id="sidebar">

      <a href="index.html" class="side-link active" data-cat="all"><i class="fa-solid fa-house"></i> Accueil</a>

      <p>Un pays au cœur de la biodiversité africaine</p>

    <section class="categories">
      <button class="cat-btn active" data-cat="all">Tout</button>
      <button class="cat-btn" data-cat="faune">Faune</button>
      <button class="cat-btn" data-cat="flore">Flore</button>
